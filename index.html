<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="slider">
      <div class="slider-container">
        <div class="slides">
          <img
            src="https://wowslider.com/sliders/demo-18/data1/images/hongkong1081704.jpg"
            class="slide"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTA4dygU2jh0WflBRJEIS9gYeArsuFsq5pnPg&s"
            class="slide"
          />
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSlfGRObsfzeIHJNHBRpdeluIQYBxGyC8phAg&s"
            class="slide"
          />
        </div>
      </div>

      <div class="controls">
        <button id="prev">⟨</button>
        <button id="next">⟩</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
